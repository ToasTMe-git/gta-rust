[package]
name = "gta7-rust"
version = "0.1.0"
edition = "2021"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
wgpu = "0.20"
winit = "0.29"
glam = "0.29"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
evdev = "0.12"
libc = "0.2"
aes-gcm = "0.10"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
